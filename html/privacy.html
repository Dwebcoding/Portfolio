<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title data-i18n="privacy_title">Privacy Policy | Delibero Lorenzo</title>
    <meta name="description" data-i18n-content="privacy_description" content="Privacy Policy di Lorenzo Delibero.">

    <!-- Libs CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Particles Background -->
    <div id="particles-bg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></div>

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Privacy Section -->
    <main class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 terminal-text">
                <h2 class="section-title text-center" data-i18n="privacy_title"></h2>
                
                <div data-aos="fade-up">
                    <h3 data-i18n="privacy_data_collection"></h3>
                    <p data-i18n="privacy_data_text"></p>
                </div>

                <div data-aos="fade-up" data-aos-delay="100">
                    <h3 data-i18n="privacy_cookies"></h3>
                    <p data-i18n="privacy_cookies_text"></p>
                </div>

                <div data-aos="fade-up" data-aos-delay="200">
                    <h3 data-i18n="privacy_contact"></h3>
                    <p data-i18n="privacy_contact_text"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/particles-config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/lang.js"></script>
    <script src="../js/seo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
